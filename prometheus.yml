global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: users-service
    metrics_path: /metrics
    static_configs:
      - targets: ["users:8080"]

  - job_name: events-service
    metrics_path: /metrics
    static_configs:
      - targets: ["events:8080"]

  - job_name: bookings-service
    metrics_path: /metrics
    static_configs:
      - targets: ["bookings:8080"]
