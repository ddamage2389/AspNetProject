name: aspnetproject-sprint9

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: 8080
  JwtSettings__Secret: ${JWT_SECRET:-development-only-shared-jwt-secret-change-before-deployment}
  JwtSettings__Issuer: AspNetProject.Users
  JwtSettings__Audience: AspNetProject
  JwtSettings__ExpiryMinutes: 60
  Kafka__BootstrapServers: kafka:29092

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: [CMD-SHELL, "nc -z localhost 2181"]
      interval: 10s
      timeout: 15s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  users-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["users-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d users"]
      interval: 5s
      timeout: 5s
      retries: 15

  events-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["events-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d events"]
      interval: 5s
      timeout: 5s
      retries: 15

  bookings-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["bookings-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d bookings"]
      interval: 5s
      timeout: 5s
      retries: 15

  users:
    build:
      context: .
      dockerfile: src/Services/Users/AspNetProject.Users.Api/Dockerfile
    ports: ["127.0.0.1:5001:8080"]
    environment:
      <<: *api-environment
      ConnectionStrings__Database: Host=users-db;Database=users;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      SeedAdmin__Login: ${ADMIN_LOGIN:-admin}
      SeedAdmin__Password: ${ADMIN_PASSWORD:-Admin123!local}
    depends_on:
      users-db:
        condition: service_healthy

  events:
    build:
      context: .
      dockerfile: src/Services/Events/AspNetProject.Events.Api/Dockerfile
    ports: ["127.0.0.1:5002:8080"]
    environment:
      <<: *api-environment
      ConnectionStrings__Database: Host=events-db;Database=events;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Kafka__ConsumerGroup: events-service
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  bookings:
    build:
      context: .
      dockerfile: src/Services/Bookings/AspNetProject.Bookings.Api/Dockerfile
    ports: ["127.0.0.1:5003:8080"]
    environment:
      <<: *api-environment
      ConnectionStrings__Database: Host=bookings-db;Database=bookings;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      BookingSettings__MaxActiveBookingsPerUser: 5
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  users-data:
  events-data:
  bookings-data:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
